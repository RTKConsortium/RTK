fail_fast: true
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-added-large-files
      args: ['--maxkb=200']
    - id: check-merge-conflict
      args: ['--assume-in-merge']
    - id: end-of-file-fixer
    - id: trailing-whitespace

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v19.1.7
  hooks:
    - id: clang-format
      args: ['--style=file']
      files: '\.(c|cc|h|cxx|hxx|cu)$'

- repo: https://github.com/psf/black
  rev: 24.2.0
  hooks:
    - id: black
      args: ['--target-version', 'py39']

- repo: https://github.com/asottile/pyupgrade
  rev: v3.22.0
  hooks:
    - id: pyupgrade
      args: ['--py39-plus']

- repo: https://github.com/BlankSpruce/gersemi
  rev: 0.19.3
  hooks:
    - id: gersemi
      args: ['--config', '.gersemi.config', '-i']
      files: '\.(cmake|wrap)$|CMakeLists.txt'

- repo: https://github.com/lycheeverse/lychee
  rev: lychee-v0.24.2
  hooks:
    - id: lychee
      args: ['--no-progress', '--config', 'utilities/lychee.toml']
      files: '\.(md|rst|txt|html|htm|h|hxx|cxx)$'
      exclude: '^(documentation/Doxygen|utilities/(gengetopt|lp_solve))/'

- repo: local
  hooks:
    - id: kw-commit-msg
      name: 'kw commit-msg'
      entry: python utilities/hooks/kw-commit-msg.py
      language: python
      stages: [commit-msg]
    - id: kw-prose-budget
      name: 'kw prose-budget (advisory unless ITK_AI_AGENT=1)'
      entry: python utilities/hooks/kw-prose-budget.py
      language: python
      stages: [commit-msg]
